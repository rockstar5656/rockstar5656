<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc"><title id="title">Vidit Shah / Engineering Lab</title><desc id="desc">Robotics, AI and systems engineering shown as an interactive technical lab.</desc>
