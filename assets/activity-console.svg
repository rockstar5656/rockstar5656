<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Vidit Shah — Engineering Activity Console</title>
<desc id="desc">Animated console representing build, test, debug, measure, document and ship activity.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#101525"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .dash{animation:dash 2.6s linear infinite}.blink{animation:blink 1.4s ease-in-out infinite}.bar1{animation:bar 2.8s ease-in-out infinite}.bar2{animation:bar 3.4s ease-in-out infinite .4s}.bar3{animation:bar 2.2s ease-in-out infinite .8s}
    @keyframes dash{to{stroke-dashoffset:-36}}@keyframes blink{50%{opacity:.25}}@keyframes bar{0%,100%{transform:scaleX(.62);transform-origin:left}50%{transform:scaleX(1)}}
    text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
  </style>
</defs>
<rect width="1200" height="420" rx="30" fill="url(#bg)"/>
<rect width="1200" height="420" rx="30" fill="url(#grid)"/>
<rect x="28" y="28" width="1144" height="364" rx="24" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".12"/>
<text x="58" y="67" class="mono" font-size="11" letter-spacing="3" fill="#a5f3fc">/BUILD STREAM</text>
<text x="1142" y="67" class="mono" font-size="10" text-anchor="end" fill="#64748b">VIDIT / ENGINEERING ACTIVITY</text>

<g transform="translate(58 98)">
  <rect width="1084" height="92" rx="18" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="38" cy="46" r="9" fill="#86efac" filter="url(#glow)"/>
  <text x="62" y="36" class="mono" font-size="10" fill="#86efac">ACTIVE LOOP</text>
  <text x="62" y="59" font-size="17" font-weight="600" fill="#f8fafc">design → implement → measure → break → verify → publish</text>
  <path class="dash" d="M650 46H1010" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 12"/>
  <circle cx="1010" cy="46" r="6" fill="#c4b5fd" class="blink"/>
</g>

<g transform="translate(58 218)">
  <g>
    <text class="mono" font-size="9" fill="#64748b">01 / BUILD</text><text x="0" y="25" font-size="20" fill="#f8fafc">🧩 systems</text>
    <rect x="0" y="47" width="320" height="8" rx="4" fill="#1e293b"/><rect class="bar1" x="0" y="47" width="258" height="8" rx="4" fill="#67e8f9"/>
    <text x="0" y="80" class="mono" font-size="9" fill="#64748b">architecture · interfaces · integration</text>
  </g>
  <g transform="translate(360 0)">
    <text class="mono" font-size="9" fill="#64748b">02 / VERIFY</text><text x="0" y="25" font-size="20" fill="#f8fafc">🧪 experiments</text>
    <rect x="0" y="47" width="320" height="8" rx="4" fill="#1e293b"/><rect class="bar2" x="0" y="47" width="244" height="8" rx="4" fill="#a78bfa"/>
    <text x="0" y="80" class="mono" font-size="9" fill="#64748b">tests · benchmarks · failure analysis</text>
  </g>
  <g transform="translate(720 0)">
    <text class="mono" font-size="9" fill="#64748b">03 / PUBLISH</text><text x="0" y="25" font-size="20" fill="#f8fafc">📓 evidence</text>
    <rect x="0" y="47" width="320" height="8" rx="4" fill="#1e293b"/><rect class="bar3" x="0" y="47" width="220" height="8" rx="4" fill="#f9a8d4"/>
    <text x="0" y="80" class="mono" font-size="9" fill="#64748b">decisions · docs · reproducibility</text>
  </g>
</g>

<text x="58" y="365" class="mono" font-size="10" fill="#475569">STATUS: CONTINUOUS BUILD / SIGNALS ARE DIRECTIONAL, NOT CLAIMS OF COMPLETION</text>
</svg>