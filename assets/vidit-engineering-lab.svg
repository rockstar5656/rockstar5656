<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#08111E"/><stop offset=".5" stop-color="#0B1222"/><stop offset="1" stop-color="#130D20"/></linearGradient>
  <linearGradient id="line" x1="50" y1="0" x2="1230" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#69D7FF"/><stop offset=".5" stop-color="#9D8CFF"/><stop offset="1" stop-color="#78E4D0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#73D9FF" stop-opacity=".24"/><stop offset="1" stop-color="#73D9FF" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glowf"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#F3F7FC}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#8FA0B4}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#87DDF6;font-size:10px;letter-spacing:2px}.node{fill:#0F1927;stroke:#29405A}.thin{stroke:#29405A;stroke-width:1}.wire{stroke:url(#line);stroke-opacity:.48;stroke-width:1.5;stroke-dasharray:6 8}.pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.dash{animation:dash 8s linear infinite}@keyframes pulse{50%{opacity:.55;transform:scale(1.06)}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes dash{to{stroke-dashoffset:-140}}
  </style>
</defs>
